name: Contract validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12.12'
          - os: windows-2022
            python: '3.12.10' # Last 3.12 Windows binary; compatibility check
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check out the fixed parser reproduction control
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 4444651d378424836a1696017bb9ab86a0fa5c13
          path: parser-control
          persist-credentials: false
      - name: Reproduce nullable HTML crash on old code and verify repair
        run: python -X dev -W error tools/reproduce_html_attribute_failure.py --baseline-root parser-control
      - name: Validate local run configurations
        run: python -X dev -W error tools/validate_contracts.py
      - name: Test contract rejection cases
        run: python -X dev -W error -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -W error -m compileall -q shirushi shirushi_eval tools tests
      - name: Stress ordered outputs and retained state at local batch sizes
        run: python -X dev -W error tools/validate_execution_scale.py --output-dir out/execution-scale

  public-contract-product:
    name: Published contract, growing batches and browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.12'
      - name: Cold launch, resource guard, 100/300/1100/1500 membership and replay
        run: python -X dev -W error tools/validate_official_boundary.py --output-dir out/public-boundary
      - name: Render 100 supported synthetic profiles
        run: python -c "from pathlib import Path; from shirushi.run import read_envelopes; from shirushi.showcase import render; render(read_envelopes('out/public-boundary/100/output.jsonl'), Path('out/public-preview'))"
      - name: Install pinned browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-check" playwright@1.58.2 --no-audit --no-fund
          "$RUNNER_TEMP/browser-check/node_modules/.bin/playwright" install --with-deps chromium
      - name: Search, compare, evidence and 1440/390/320 pixel acceptance
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-check/node_modules/playwright
        run: node tools/validate_showcase_browser.cjs out/public-preview out/browser-validation.json
      - name: Retain synthetic checks and product screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-contract-product-${{ github.run_id }}
          path: |
            out/public-boundary/validation.json
            out/browser-validation.json
            out/profile-*.png
          if-no-files-found: error
          retention-days: 14

  frozen-live-shard:
    name: Live published-contract shard with frozen CSV identity
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.12'
      - name: Prepare declared smoke snapshot and audit evaluator command
        run: python -X dev -W error tools/validate_official_live.py --output-dir out/frozen-live --discovery-access-receipt configs/anysearch-anonymous.json
      - name: Retain bound summary without source bodies or company exports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frozen-live-shard-${{ github.run_id }}
          path: |
            out/frozen-live/validation.json
            out/frozen-live/report.json
            out/frozen-live/registry-receipt.json
            out/frozen-live/input.jsonl
          if-no-files-found: error
          retention-days: 14

  external-support:
    name: External support (${{ matrix.cohort }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cohort: [development, validation]
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.12'
      - name: Run frozen companies and independent external source audit
        run: python -X dev -W error tools/validate_external_run.py --cohort ${{ matrix.cohort }} --output-dir out/external-${{ matrix.cohort }} --discovery-access-receipt configs/anysearch-anonymous.json
      - name: Retain execution summary without raw company pages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: external-support-${{ matrix.cohort }}-${{ github.run_id }}
          path: |
            out/external-*/validation.json
            out/external-*/config.json
            out/external-*/input.jsonl
          if-no-files-found: error
          retention-days: 14

  external-opportunities:
    name: External company gains (${{ matrix.cohort }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cohort: [development, validation]
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check out fixed pre-repair control
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 665e53292b207fd0c36c282fdd00e329f7fcb7e8
          path: baseline
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.12'
      - name: Compare live source-positive companies under equal budgets
        run: python -X dev -W error tools/validate_nav_opportunities.py --baseline-root baseline --cohort ${{ matrix.cohort }} --output-dir out/opportunities-${{ matrix.cohort }}
      - name: Retain bound gain summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: external-gains-${{ matrix.cohort }}-${{ github.run_id }}
          path: |
            out/opportunities-*/validation.json
            out/opportunities-*/*/input.jsonl
            out/opportunities-*/*/config.json
          if-no-files-found: error
          retention-days: 14

  website-opportunity:
    name: Live legal-seller website regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.12'
      - name: Audit live discovery, legal ownership and catalogue coverage
        run: python -X dev -W error tools/validate_website_opportunity.py
      - name: Audit credential-free discovery without any search provider
        if: always()
        run: python -X dev -W error tools/validate_website_opportunity.py --without-search --output-dir out/website-no-search
      - name: Retain bound website audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-opportunity-${{ github.run_id }}
          path: |
            out/website-opportunity/validation.json
            out/website-opportunity/config.json
            out/website-opportunity/input.jsonl
            out/website-no-search/validation.json
            out/website-no-search/config.json
            out/website-no-search/input.jsonl
          if-no-files-found: error
          retention-days: 14

  combined-shard:
    name: Combined 100-company shard within organizer limits
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.12'
      - name: Audit all enabled sources on one supplied test shard
        run: python -X dev -W error tools/validate_external_run.py --cohort development --output-dir out/combined-shard --config configs/shard-validation.json --discovery-access-receipt configs/anysearch-anonymous.json
      - name: Retain bound shard summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: combined-shard-${{ github.run_id }}
          path: |
            out/combined-shard/validation.json
            out/combined-shard/config.json
            out/combined-shard/input.jsonl
          if-no-files-found: error
          retention-days: 14

  live-smoke:
    name: Fresh financial coverage and source audit
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.12'
      - name: Run fresh public companies and independent support audit
        run: python -X dev -W error tools/validate_live_run.py --count 100 --output-dir out/live-smoke
      - name: Validate the next public discovery page
        run: python -X dev -W error tools/validate_live_run.py --count 100 --page 1 --output-dir out/live-validation
      - name: Check cohort separation
        run: python -X dev -W error tools/validate_live_cohorts.py out/live-smoke out/live-validation
      - name: Retain bound summaries and cohort manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-validation-${{ github.run_id }}
          path: |
            out/live-*/validation.json
            out/live-*/input.jsonl
            out/live-*/config.json
          if-no-files-found: error
          retention-days: 14
