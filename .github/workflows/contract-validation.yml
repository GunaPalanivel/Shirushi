name: Contract validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12.12'
          - os: windows-2022
            python: '3.12.10' # Last 3.12 Windows binary; compatibility check
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Validate local run configurations
        run: python -X dev -W error tools/validate_contracts.py
      - name: Test contract rejection cases
        run: python -X dev -W error -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -W error -m compileall -q shirushi tools tests
